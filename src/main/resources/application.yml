server:
  port: 8080
  servlet:
    context-path: "/api/v1"
spring:
  application:
    name: "home-work"
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mydb
    username: admin
    password: secret
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: gtel
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: secret
  queue:
    send-register-otp:
      name: "sendOTPRegisterQueue"
      exchangeName: "sendOTPRegisterExchange"
      routingKey: "sendOTPRegisterRoutingKey"
  cache:
    send-register-otp:
      life-otp-seconds: 180
      lock-resend-otp-seconds: 120
      max-count-otp: 5
      max-count-incorrect-otp: 5
